<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마우스 감도 적응 연습</title>
<style>
:root{--bg:#000;--dot:#ffd400;--dim:#8a7a2a;--txt:#d9d2b0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;overflow:hidden;user-select:none}
#field{position:absolute;inset:0;cursor:default}
.dot{position:absolute;border-radius:50%;background:var(--dot);transform:translate(-50%,-50%)}
#center{left:50%;top:50%}
#target,#bar2{display:none}
#bar2{position:absolute;background:var(--dot);opacity:.8}
#bar2.on{opacity:1;box-shadow:0 0 0 2px #fff4}
#hud{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;gap:20px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 14px;font-size:14px;color:var(--dim);pointer-events:none}
#hud b{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums}
#hud>div{display:flex;gap:20px}
#bar{position:absolute;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px;font-size:13px;color:var(--dim)}
#bar input{accent-color:var(--dot);width:110px}
#bar button{background:none;border:1px solid var(--dim);color:var(--txt);padding:5px 12px;border-radius:4px;font:inherit;cursor:pointer}
#bar button[aria-pressed=true]{background:var(--dot);border-color:var(--dot);color:#000;font-weight:600}
#bar button:focus-visible,#bar input:focus-visible{outline:2px solid var(--dot);outline-offset:2px}
#hint{position:absolute;left:50%;top:calc(50% + 44px);transform:translateX(-50%);font-size:13px;color:var(--dim);pointer-events:none}
#bar input[type=checkbox]{width:auto;accent-color:var(--dot)}
.ov{position:absolute;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;z-index:5;overflow:auto}
#home{display:flex}
.col{width:100%;max-width:400px;display:flex;flex-direction:column;gap:26px}
.ttl{font-size:26px;font-weight:700;color:var(--dot)}
.grp{display:flex;flex-direction:column;gap:10px}
.lab{font-size:15px;font-weight:600;color:var(--txt)}
.desc{font-size:13px;color:var(--dim);min-height:1em}
.row{display:flex;gap:10px;flex-wrap:wrap}
.ov button{background:none;border:1px solid var(--dim);color:var(--txt);padding:10px 18px;border-radius:6px;font:inherit;font-size:15px;cursor:pointer}
.ov button[aria-pressed=true]{background:var(--dot);border-color:var(--dot);color:#000;font-weight:600}
.ov button.go{background:var(--dot);border-color:var(--dot);color:#000;font-weight:700}
.ov button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.score{font-size:64px;font-weight:700;color:var(--dot);font-variant-numeric:tabular-nums;line-height:1}
.rw{display:flex;justify-content:space-between;font-size:15px;padding:6px 0;border-bottom:1px solid #2a2508}
.rw b{font-variant-numeric:tabular-nums}
input[type=text]{background:#111;border:1px solid var(--dim);color:var(--txt);padding:10px 12px;border-radius:6px;font:inherit;font-size:15px;width:100%;box-sizing:border-box}
input[type=text]:focus-visible{outline:2px solid var(--dot);outline-offset:1px}
#pv{position:relative;height:150px;border:1px solid var(--dim);border-radius:6px;background:#000;overflow:hidden}
#pvA{left:35%;top:50%}#pvB{left:75%;top:50%}
#pvR{position:absolute;top:18px;bottom:18px;left:50%;transform:translateX(-50%);background:var(--dot)}
#pvC{position:absolute;left:35%;top:50%;pointer-events:none}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--txt)}
.srow input{width:58%;accent-color:var(--dot)}
#count{font-size:120px;font-weight:700;color:var(--dot);justify-content:center}
</style>
</head>
<body>
<div id="field">
  <div id="hud">
    <div id="h1"><span>성공 <b id="n">0</b></span><span>평균 이동 <b id="avg">-</b> ms</span><span>빗나감 <b id="miss">0</b></span></div>
    <div id="h2" style="display:none"><span>유지율 <b id="pct">-</b>%</span><span>이탈 <b id="exits">0</b>회</span></div>
    <div id="h3" style="display:none"><span>남은 시간 <b id="tl">-</b>초</span><span>점수 <b id="sc">0</b></span></div>
  </div>
  <div class="dot" id="center"></div>
  <div class="dot" id="target"></div>
  <div id="bar2"></div>
  <div id="hint">가운데 점을 눌러 시작</div>
  <div id="bar">
    <button type="button" data-mode="kite" aria-pressed="true">카이팅</button>
    <button type="button" data-mode="aim" aria-pressed="false">에임</button>
    <button type="button" data-mode="track" aria-pressed="false">트래킹</button>
    <label id="sizeL">점 크기 <input type="range" id="size" min="10" max="60" value="60"></label>
    <label id="thickL" style="display:none">두께 <input type="range" id="thick" min="4" max="60" value="60"></label>
    <label id="speedL" style="display:none">최대 속도 <input type="range" id="speed" min="100" max="1000" step="25" value="350"></label>
    <label id="sfxL"><input type="checkbox" id="sfx" checked> 효과음</label>
    <button type="button" id="homeBtn">홈</button>
    <button type="button" id="reset">기록 지우기</button>
  </div>
</div>
<div class="ov" id="home"><div class="col">
  <div class="ttl">마우스 감도 적응</div>
  <div class="grp"><div class="lab">닉네임</div><input type="text" id="nick" maxlength="12" placeholder="랭킹에 표시될 이름" autocomplete="off"></div>
  <div class="grp"><div class="lab">모드</div><div class="row">
    <button type="button" data-hm="kite">카이팅</button><button type="button" data-hm="aim">에임</button><button type="button" data-hm="track">트래킹</button></div></div>
  <div class="grp"><div class="lab">연습 모드</div><div class="desc">시간 제한 없이 점 크기, 두께, 속도를 바꿔 가며 연습해요.</div>
    <div class="row"><button type="button" class="go" id="goPractice">연습 시작</button></div></div>
  <div class="grp"><div class="lab">타임어택</div><div class="row">
    <button type="button" data-dur="15">15초</button><button type="button" data-dur="30">30초 추천</button><button type="button" data-dur="60">1분</button></div>
    <div class="desc">PC는 전체화면에서만 기록돼요. 모바일은 따로 구분된 랭킹에 기록돼요.</div>
    <div class="desc" id="warn" style="color:var(--dot)"></div>
    <div class="desc" id="bestL"></div>
    <div class="row"><button type="button" class="go" id="goTA">타임어택 시작</button></div></div>
  <div class="grp"><div class="lab" id="rankT">랭킹</div><div class="row"><button type="button" data-bd="pc">PC</button><button type="button" data-bd="m">모바일</button></div><div id="rank"></div></div>
</div></div>
<div class="ov" id="setup"><div class="col">
  <div class="ttl" id="stT">원 크기 맞추기</div>
  <div id="pv"><div class="dot" id="pvA"></div><div class="dot" id="pvB"></div><div id="pvR"></div>
    <svg id="pvC" width="14" height="22" viewBox="0 0 14 22" aria-hidden="true"><path d="M0.5 0.5 L0.5 17 L4.5 13.3 L7.5 20 L10 19 L7.2 12.4 L12.5 12.4 Z" fill="#fff" stroke="#000"/></svg></div>
  <div class="desc" id="pvL"></div>
  <label class="srow" id="r1">점 크기 <input type="range" id="sz2" min="10" max="60"></label>
  <label class="srow" id="r2">두께 <input type="range" id="th2" min="4" max="60"></label>
  <label class="srow" id="r3">최대 속도 <input type="range" id="sp2" min="100" max="1000" step="25"></label>
  <div class="desc">작을수록 점수 배율이 올라가요(최대 ×2.0). 흰색 화살표는 기본 크기 마우스 커서 예시예요. 시작하면 타임어택 중에는 바꿀 수 없어요.</div>
  <div class="row"><button type="button" class="go" id="stGo">시작</button><button type="button" id="stBack">홈으로</button></div>
</div></div>
<div class="ov" id="count"></div>
<div class="ov" id="result"><div class="col">
  <div class="lab" id="rT"></div><div class="score" id="rS"></div><div id="rR"></div><div class="desc" id="rB"></div>
  <input type="text" id="rNick" maxlength="12" placeholder="닉네임을 입력해 주세요" autocomplete="off" style="display:none">
  <div class="row"><button type="button" class="go" id="postB">최고 기록 게시</button></div>
  <div class="desc" id="rMsg"></div><div id="rankR"></div>
  <div class="row"><button type="button" id="again">다시 하기</button><button type="button" id="toHome">홈으로</button></div>
</div></div>

    $('pvC').style.left=tr?'50%':'35%';
    var mm=tr?1+(60-thick)/56:1+(60-size)/50;
    $('pvL').textContent=(tr?'두께 '+thick+'px':'지름 '+size+'px')+' · 점수 ×'+mm.toFixed(2);
    $('sz2').value=size;$('th2').value=thick;$('sp2').value=maxV;
  }
  $('goTA').addEventListener('click',function(){$('home').style.display='none';$('setup').style.display='flex';updPV()});
  $('sz2').addEventListener('input',function(){setSize(+this.value);$('size').value=this.value;updPV()});
  $('th2').addEventListener('input',function(){thick=+this.value;$('thick').value=this.value;updPV()});
  $('sp2').addEventListener('input',function(){maxV=+this.value;$('speed').value=this.value;updPV()});
  $('stGo').addEventListener('click',function(){$('setup').style.display='none';startTA()});
  $('stBack').addEventListener('click',idle);
  $('again').addEventListener('click',startTA);
  $('toHome').addEventListener('click',idle);
  $('homeBtn').addEventListener('click',idle);
  var db=null,uid=null,nick='',board={};
  try{nick=localStorage.getItem('mt-nick')||''}catch(e){}
  $('nick').value=nick;
  $('nick').addEventListener('input',function(){nick=this.value.trim();try{localStorage.setItem('mt-nick',nick)}catch(e){}});
  function listFor(key){
    var list=[];
    Object.keys(board).forEach(function(id){var d=board[id],x=d&&d.scores&&d.scores[key];if(x&&x.s>0)list.push({id:id,name:String(d.name||'이름 없음'),s:x.s})});
    list.sort(function(a,b){return b.s-a.s});
    return list;
  }
  function renderBoard(){
    var key=mode+'-'+dur+'-'+bdev,list=listFor(key).slice(0,100);
    $('rankT').textContent='랭킹 · '+NM[mode]+' '+(dur===60?'1분':dur+'초')+' · '+(bdev==='m'?'모바일':'PC');
    function rowEl(e,i){
      var r=document.createElement('div'),a=document.createElement('span'),v=document.createElement('b');
      r.className='rw';a.textContent=(i+1)+'. '+e.name+(e.id===uid?' (나)':'');v.textContent=e.s;
      if(e.id===uid)r.style.color='var(--dot)';
      r.appendChild(a);r.appendChild(v);return r;
    }
    ['rank','rankR'].forEach(function(id){
      var el=$(id);el.textContent='';
      var msg=!db?'랭킹 서버에 연결하지 못했어요':(!list.length?'아직 게시된 기록이 없어요':'');
      if(msg){var m=document.createElement('div');m.className='desc';m.textContent=msg;el.appendChild(m);return}
      list.slice(0,10).forEach(function(e,i){el.appendChild(rowEl(e,i))});
      for(var j=10;j<list.length;j++)if(list[j].id===uid){
        var g=document.createElement('div');g.className='desc';g.textContent='⋯';el.appendChild(g);el.appendChild(rowEl(list[j],j));break;
      }
    });
  }
  function cleanup(){
    if(!db||!uid||!board[uid]||!board[uid].scores)return;
    var d=board[uid],sc=Object.assign({},d.scores),ch=false;
    Object.keys(sc).forEach(function(k){
      var l=listFor(k),i=-1;
      for(var j=0;j<l.length;j++)if(l[j].id===uid){i=j;break}
      if(i>=100){delete sc[k];ch=true}
    });
    if(ch&&d.name)db.collection('board').doc(uid).set({name:d.name,scores:sc}).catch(function(){});
  }
  async function postBest(){
    var key=K(),sc=bestAll()[key]||0,name=(nick||$('rNick').value||'').trim().slice(0,12),msg=$('rMsg');
    if(!sc){msg.textContent='게시할 기록이 없어요';return}
    if(!name){$('rNick').style.display='block';$('rNick').focus();msg.textContent='닉네임을 입력하고 다시 눌러 주세요';return}
    if(!db||!uid){msg.textContent='랭킹 서버에 연결되지 않았어요';return}
    nick=name;$('nick').value=name;try{localStorage.setItem('mt-nick',name)}catch(e){}
    var others=listFor(key).filter(function(e){return e.id!==uid});
    if(others.length>=100&&sc<=others[99].s){msg.textContent='100등 안에 들어야 게시할 수 있어요 (100등 '+others[99].s+'점)';return}
    $('postB').disabled=true;msg.textContent='게시하는 중이에요';
    try{
      var ref=db.collection('board').doc(uid),snap=await ref.get(),d=snap.exists?snap.data():{},sc2=Object.assign({},d.scores||{});
      var prev=sc2[key]&&sc2[key].s||0;
      sc2[key]={s:Math.max(prev,sc),t:Date.now()};
      await ref.set({name:name,scores:sc2});
      msg.textContent='게시했어요';$('rNick').style.display='none';
    }catch(e){msg.textContent='게시하지 못했어요. 잠시 후 다시 시도해 주세요'}
    $('postB').disabled=false;
  }
  $('postB').addEventListener('click',postBest);
  (async function(){
    try{
      if(!window.firebase||FIREBASE_CONFIG.apiKey==='YOUR_API_KEY')throw 0;
      firebase.initializeApp(FIREBASE_CONFIG);
      var cred=await firebase.auth().signInAnonymously();
      uid=cred.user.uid;db=firebase.firestore();
      db.collection('board').onSnapshot(function(sn){board={};sn.docs.forEach(function(d){board[d.id]=d.data()});renderBoard();cleanup()},function(){});
    }catch(e){db=null;uid=null}
    renderBoard();
  })();
  initAudio();setSize(size);idle();
})();
</script>
</body>
</html>
